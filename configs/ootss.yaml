schema_version: 1
job_name: game-bench-ootss
jobs_dir: jobs
n_attempts: 1
tasks:
- path: tasks/ootss-heroes-artifacts-7
agents:
- name: opencode-v2
  model_name: deepseek/deepseek-flash
  base_url: https://api.deepseek.com/v1
  model_api_key_name: DEEPSEEK_API_KEY
  model_api_format: openai_chat_completions
  kwargs:
    version: 2.2.5
    disable_web_search: true
    opencode_config:
      providers:
        deepseek:
          name: DeepSeek
          env:
          - DEEPSEEK_API_KEY
          package: '@opencode/ai/providers/openai-compatible'
          settings:
            baseURL: https://api.deepseek.com/v1
          models:
            deepseek-flash:
              name: DeepSeek V4.1 Flash
              modelID: deepseek-flash
              capabilities:
                tools: true
                input:
                - text
                - image
                output:
                - text
                reasoning:
                  supported: true
              compatibility:
                reasoningField: reasoning_content
              body:
                thinking:
                  type: enabled
                reasoning_effort: low
      policies:
      - action: tool.use
        resource: shell:*
        effect: deny
      - action: tool.use
        resource: read:*
        effect: deny
      - action: tool.use
        resource: edit:*
        effect: deny
      - action: tool.use
        resource: glob:*
        effect: deny
      - action: tool.use
        resource: grep:*
        effect: deny
      - action: tool.use
        resource: list:*
        effect: deny
      - action: tool.use
        resource: browser:*
        effect: deny
      - action: tool.use
        resource: webfetch:*
        effect: deny
      - action: tool.use
        resource: websearch:*
        effect: deny
      - action: tool.use
        resource: subagent:*
        effect: deny
      - action: mcp.use
        resource: '*'
        effect: deny
      - action: mcp.use
        resource: ootss
        effect: allow
  mcp_servers:
  - name: ootss
    transport: stdio
    command: python3
    args:
    - /app/serve.py
